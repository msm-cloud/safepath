name: PR checks

# Lint, type check, formatting and the test suites on every PR. Needs no
# secrets: the RLS suite runs the migrations against an in-process PGlite
# database and the auth-identifier suite fakes its Supabase calls, so
# nothing here touches the live project.
on:
  pull_request:

permissions:
  contents: read

# A new commit on the same PR makes the previous run moot.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from packageManager in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 24 runs the .ts test file directly (type stripping on by default).
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: RLS tests
        run: pnpm test:rls

      - name: auth-identifier tests
        run: pnpm test:auth-identifier
