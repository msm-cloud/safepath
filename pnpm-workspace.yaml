packages:
  - 'mobile'
  - 'dashboard'
  - 'packages/*'
# Expo's Metro bundler doesn't resolve pnpm's default isolated symlink
# layout correctly (https://docs.expo.dev/guides/monorepos/) — hoisted
# flattens node_modules like npm/yarn classic, which Metro expects.
nodeLinker: hoisted
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/eslint-plugin-next@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - eslint-config-next@16.3.2
  - next@16.3.2
  - expo-eas-client@57.0.2
  - expo-updates@57.0.18
  - '@expo/log-box@57.0.4'
  - '@expo/metro-runtime@57.0.14'
  - '@expo/ui@57.0.14'
  - expo-constants@57.0.15
  - expo-haptics@57.0.2
  - expo-linking@57.0.8
  - expo-location@57.0.14
  - expo-notifications@57.0.15
  - expo-router@57.0.17
  - eslint-config-expo@57.0.2
  - '@expo/cli@57.0.19'
  - '@expo/inline-modules@0.1.7'
  - '@expo/local-build-cache-provider@57.0.8'
  - '@expo/metro-config@57.0.11'
  - '@expo/prebuild-config@57.0.15'
  - '@expo/router-server@57.0.8'
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-file-system@57.0.6
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo@57.0.17
