<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePath – Sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4F1;font-family:'Figtree',system-ui,sans-serif;color:#171A2F}
a{color:#3B45B5}a:hover{color:#2A3290}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 22px 28px; display: flex; flex-direction: column; gap: 18px; background: #F6F4F1; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E4E1EA; color: #171A2F; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div role="group" aria-label="Language" style="display: flex; padding: 4px; gap: 2px; background: #EAE7EF; border-radius: 999px">
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #171A2F; color: #FFFFFF; font-size: 13px; font-weight: 700">EN</button>
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: #171A2F; font-size: 14px; font-weight: 600; font-family: 'Hind Siliguri', sans-serif">বাংলা</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; align-self: flex-start; padding: 6px 12px 6px 6px; border-radius: 999px; background: #E6E8F7">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c3 2 9 2 12 0v-5"></path></svg></span>
      <span style="font-size: 14px; font-weight: 700; color: #2A3290">Signing up as Student</span>
      <a href="Main.dc.html" style="font-size: 14px; font-weight: 700">Change</a>
    </div>
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -0.01em">Create your account</h1>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-name" style="font-size: 14px; font-weight: 700">Full name</label>
      <input id="su-name" type="text" placeholder="Your name" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-phone" style="font-size: 14px; font-weight: 700">Phone number</label>
      <div style="display: flex; gap: 8px">
        <span style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #F0EEF4; display: flex; align-items: center; font-size: 16px; font-weight: 600">+880</span>
        <input id="su-phone" type="tel" placeholder="1XXX XXXXXX" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-email" style="font-size: 14px; font-weight: 700">Email</label>
      <input id="su-email" type="email" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="su-pass" style="font-size: 14px; font-weight: 700">Password</label>
      <div style="position: relative">
        <input id="su-pass" type="password" placeholder="At least 8 characters" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 52px 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
        <button aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: none; background: transparent; color: #474B5C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <input id="su-agree" type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: {{primary}}; flex-shrink: 0">
      <label for="su-agree" style="font-size: 14px; line-height: 1.45; color: #474B5C">I agree to the <a href="#privacy" style="font-weight: 700">Privacy Policy</a></label>
    </div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <button style="height: 58px; border: none; border-radius: 18px; background: #171A2F; color: #FFFFFF; font-size: 17px; font-weight: 700">Create account</button>
    <div style="text-align: center; font-size: 15px; color: #5C6070">Already have an account? <a href="Auth-SignIn.dc.html" style="font-weight: 700">Log in</a></div>
    <div style="text-align: center; font-size: 14px"><a href="#guide" style="font-weight: 600">Need help? View the user guide</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3B45B5","options":["#3B45B5","#0B6E73","#6D2E8C","#1E3A5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#3B45B5' };
  }
}
</script>
</body>
</html>
