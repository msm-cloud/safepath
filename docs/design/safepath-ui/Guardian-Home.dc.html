<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePath – Guardian home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4F1;font-family:'Figtree',system-ui,sans-serif;color:#171A2F}
a{color:#3B45B5}a:hover{color:#2A3290}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F4F1; overflow: hidden">
  <div style="flex-grow: 1; box-sizing: border-box; padding: 52px 20px 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div>
        <div style="font-size: 14px; color: #5C6070">Guardian</div>
        <div style="font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700">Your family</div>
      </div>
      <button style="height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; color: #171A2F; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Invite</button>
    </div>
    <a href="Guardian-Alert.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #C8231B; color: #FFFFFF; text-decoration: none">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; flex-shrink: 0">SOS</span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 16px; font-weight: 700">Nusrat needs help</span><span style="display: block; font-size: 13px; opacity: 0.9">Started 10:42 PM · 0.8 km away</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1EA; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 46px; height: 46px; border-radius: 50%; background: #E6E8F7; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">RA</span>
          <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">Rafi</span><span style="display: block; font-size: 13px; color: #5C6070">On a journey home</span></span>
          <span style="padding: 5px 10px; border-radius: 999px; background: #E6E8F7; color: #2A3290; font-size: 12px; font-weight: 700">Journey</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #474B5C"><span>Next check-in in <strong style="color: #171A2F">8 min</strong></span><a href="#track" style="font-weight: 700">Track</a></div>
      </div>
      <div style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1EA; display: flex; align-items: center; gap: 12px">
        <span style="width: 46px; height: 46px; border-radius: 50%; background: #FBE9D7; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">SA</span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">Sadia</span><span style="display: block; font-size: 13px; color: #5C6070">Checked in 7:30 PM</span></span>
        <span style="padding: 5px 10px; border-radius: 999px; background: #DDEEEE; color: #07555A; font-size: 12px; font-weight: 700">Safe</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#474B5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <label for="share" style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Share my location with family</span><span style="display: block; font-size: 13px; color: #5C6070">On · kept for 24 hours</span></label>
      <input id="share" type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Recent activity</h2>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #474B5C; padding: 8px 0; border-bottom: 1px solid #E4E1EA"><span>Sadia arrived at office</span><span>7:30 PM</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #474B5C; padding: 8px 0"><span>Rafi started a journey</span><span>9:05 PM</span></div>
    </div>
  </div>
  <nav aria-label="Main" style="height: 84px; box-sizing: border-box; padding: 8px 12px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E1EA">
    <a href="#home" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{primary}}; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Family</a>
    <a href="#alerts" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>Alerts</a>
    <a href="#history" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>
    <a href="#settings" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3B45B5","options":["#3B45B5","#0B6E73","#6D2E8C","#1E3A5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#3B45B5' };
  }
}
</script>
</body>
</html>
