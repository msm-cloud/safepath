      <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Ammu</span>
      <input type="radio" name="caller" checked style="width: 20px; height: 20px; margin: 0; accent-color: {{primary}}">
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E1EA">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #FBE9D7; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">AB</span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Abbu</span>
      <input type="radio" name="caller" style="width: 20px; height: 20px; margin: 0; accent-color: {{primary}}">

    </label>
  </fieldset>

  <fieldset style="margin: 0; padding: 0; border: none">
    <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: #171A2F">Ring in</legend>

      <label style="height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E1EA; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700"><input type="radio" name="when" style="margin: 0; accent-color: {{primary}}">Now</label>

      <label style="height: 48px; border-radius: 14px; background: #E6E8F7; border: 2px solid {{primary}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700"><input type="radio" name="when" checked style="margin: 0; accent-color: {{primary}}">1 min</label>
      <label style="height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E1EA; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700"><input type="radio" name="when" style="margin: 0; accent-color: {{primary}}">5 min</label>

    <input id="ring" type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}">
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="User-FakeCall.dc.html" style="height: 56px; border-radius: 18px; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Ring in 1 minute</a>
