<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePath – Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4F1;font-family:'Figtree',system-ui,sans-serif;color:#171A2F}
a{color:#3B45B5}a:hover{color:#2A3290}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 22px 28px; display: flex; flex-direction: column; gap: 22px; background: #F6F4F1; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8.5 3.2v6.1c0 5.3-3.7 8.6-8.5 9.7-4.8-1.1-8.5-4.4-8.5-9.7V5.7z" fill="{{primary}}"></path><path d="M8.3 12.2l2.6 2.6 4.8-5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family: 'Sora', sans-serif; font-size: 21px; font-weight: 700">SafePath</span>
    </div>
    <div role="group" aria-label="Language" style="display: flex; padding: 4px; gap: 2px; background: #EAE7EF; border-radius: 999px">
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #171A2F; color: #FFFFFF; font-size: 13px; font-weight: 700">EN</button>
      <button style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; color: #171A2F; font-size: 14px; font-weight: 600; font-family: 'Hind Siliguri', sans-serif">বাংলা</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px">
    <h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Welcome back</h1>
    <div style="font-family: 'Hind Siliguri', sans-serif; font-size: 20px; font-weight: 600; color: {{primary}}">আবার স্বাগতম</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="si-id" style="font-size: 14px; font-weight: 700">Phone number or email</label>
      <input id="si-id" type="text" placeholder="01XXX XXXXXX or you@example.com" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="si-pass" style="font-size: 14px; font-weight: 700">Password</label>
        <a href="#forgot" style="font-size: 14px; font-weight: 700">Forgot password?</a>
      </div>
      <div style="position: relative">
        <input id="si-pass" type="password" placeholder="Your password" style="width: 100%; height: 54px; box-sizing: border-box; padding: 0 52px 0 16px; border-radius: 14px; border: 1.5px solid #D9D5E1; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171A2F">
        <button aria-label="Show password" style="position: absolute; right: 5px; top: 5px; width: 44px; height: 44px; border: none; background: transparent; color: #474B5C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <button style="height: 58px; margin-top: 6px; border: none; border-radius: 18px; background: #171A2F; color: #FFFFFF; font-size: 17px; font-weight: 700">Log in</button>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #5C6070">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      Your location is shared only when you choose.
    </div>
    <div style="text-align: center; font-size: 15px; color: #5C6070">New to SafePath? <a href="Main.dc.html" style="font-weight: 700">Create an account</a></div>
    <div style="text-align: center; font-size: 14px"><a href="#guide" style="font-weight: 600">Need help? View the user guide</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3B45B5","options":["#3B45B5","#0B6E73","#6D2E8C","#1E3A5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#3B45B5' };
  }
}
</script>
</body>
</html>
