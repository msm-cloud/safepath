<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePath – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4F1;font-family:'Figtree',system-ui,sans-serif;color:#171A2F}
a{color:#3B45B5}a:hover{color:#2A3290}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F4F1; overflow: hidden">
  <div style="flex-grow: 1; box-sizing: border-box; padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div>
        <div style="font-size: 14px; color: #5C6070">Good evening</div>
        <div style="font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700">Nusrat</div>
      </div>
      <a href="#guardians" style="display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E1EA; text-decoration: none; color: #171A2F">
        <span style="display: flex"><span style="width: 30px; height: 30px; border-radius: 50%; background: #E6E8F7; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">AM</span><span style="width: 30px; height: 30px; border-radius: 50%; background: #FBE9D7; border: 2px solid #FFFFFF; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">AB</span></span>
        <span style="font-size: 13px; font-weight: 700">2 guardians</span>
      </a>
    </div>
    <section aria-label="Emergency" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px">
      <div style="width: 236px; height: 236px; border-radius: 50%; background: #FBE4E2; display: flex; align-items: center; justify-content: center">
        <div style="width: 196px; height: 196px; border-radius: 50%; background: #F6C9C5; display: flex; align-items: center; justify-content: center">
          <button aria-label="SOS, hold for 3 seconds" style="width: 156px; height: 156px; border-radius: 50%; border: 6px solid #FFFFFF; background: #C8231B; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 14px 30px rgba(200,35,27,0.35)">
            <span style="font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 0.04em">SOS</span>
            <span style="font-size: 13px; font-weight: 600; opacity: 0.9">Hold 3 seconds</span>
          </button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #474B5C"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0B6E73"></span>Online · SMS backup ready<span aria-hidden="true">·</span><a href="User-TestAlert.dc.html" style="font-weight: 700; color: {{primary}}">Test SOS</a></div>
    </section>
    <a href="User-Journey.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: {{primary}}; color: #FFFFFF; text-decoration: none">
      <span style="width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="2"></circle><circle cx="18" cy="7" r="2"></circle><path d="M6 15V10a3 3 0 0 1 3-3h7M18 9v5a3 3 0 0 1-3 3H8"></path></svg></span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 16px; font-weight: 700">Start a journey</span><span style="display: block; font-size: 13px; opacity: 0.85">Guardians get check-ins until you arrive</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="User-FakeCallSetup.dc.html" style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA; color: #171A2F; text-decoration: none; display: flex; flex-direction: column; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
        <span style="font-size: 15px; font-weight: 700">Fake call</span>
      </a>
      <a href="#police" style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA; color: #171A2F; text-decoration: none; display: flex; flex-direction: column; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3z"></path></svg>
        <span style="font-size: 15px; font-weight: 700">Nearest police</span>
      </a>
      <a href="#hospital" style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA; color: #171A2F; text-decoration: none; display: flex; flex-direction: column; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M12 8v8M8 12h8"></path></svg>
        <span style="font-size: 15px; font-weight: 700">Nearest hospital</span>
      </a>
      <a href="#live" style="padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA; color: #171A2F; text-decoration: none; display: flex; flex-direction: column; gap: 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="font-size: 15px; font-weight: 700">Share live location</span>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#474B5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <label for="hist" style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Location history recording</span><span style="display: block; font-size: 13px; color: #5C6070">Off · keeps 24 hours when on</span></label>
      <input id="hist" type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}">
    </div>
  </div>
  <nav aria-label="Main" style="height: 84px; box-sizing: border-box; padding: 8px 12px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E1EA">
    <a href="#home" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{primary}}; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Home</a>
    <a href="#journeys" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="2"></circle><circle cx="18" cy="7" r="2"></circle><path d="M6 15V10a3 3 0 0 1 3-3h7M18 9v5a3 3 0 0 1-3 3H8"></path></svg>Journeys</a>
    <a href="#guardians" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3 6"></path></svg>Guardians</a>
    <a href="#settings" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #5C6070; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3B45B5","options":["#3B45B5","#0B6E73","#6D2E8C","#1E3A5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#3B45B5' };
  }
}
</script>
</body>
</html>
