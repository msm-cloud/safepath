<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePath – Journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4F1;font-family:'Figtree',system-ui,sans-serif;color:#171A2F}
a{color:#3B45B5}a:hover{color:#2A3290}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F4F1; overflow: hidden; position: relative">
  <div style="height: 360px; position: relative; flex-shrink: 0">
    <svg width="390" height="360" viewBox="0 0 390 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map showing your route home">
      <rect width="390" height="360" fill="#E9E7EF"></rect>
      <rect x="240" y="60" width="120" height="86" rx="14" fill="#DCE8E0"></rect>
      <rect x="30" y="120" width="70" height="60" rx="10" fill="#E0DDE8"></rect>
      <path d="M-10 110 H400 M-10 240 H400 M120 -10 V370 M285 -10 V370" stroke="#FFFFFF" stroke-width="14" fill="none"></path>
      <path d="M-10 340 L400 40" stroke="#FFFFFF" stroke-width="22" fill="none"></path>
      <path d="M-10 340 L400 40" stroke="#F1E2B9" stroke-width="12" fill="none"></path>
      <path d="M60 310 C120 290 115 250 170 238 S 260 170 300 96" stroke="{{primary}}" stroke-width="6" fill="none" stroke-linecap="round"></path>
      <circle cx="60" cy="310" r="8" fill="#FFFFFF" stroke="{{primary}}" stroke-width="3"></circle>
      <circle cx="170" cy="238" r="16" fill="{{primary}}" opacity="0.18"></circle>
      <circle cx="170" cy="238" r="8" fill="{{primary}}" stroke="#FFFFFF" stroke-width="3"></circle>
      <path d="M300 74c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12z" fill="#171A2F"></path>
      <circle cx="300" cy="86" r="4" fill="#FFFFFF"></circle>
    </svg>
    <div style="position: absolute; top: 52px; left: 20px; right: 20px; display: flex; justify-content: space-between">
      <a href="User-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #171A2F; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(23,26,47,0.12)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <span style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(23,26,47,0.12)"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{primary}}"></span>Guardians can see this</span>
    </div>
  </div>
  <div style="flex-grow: 1; margin-top: -28px; border-radius: 28px 28px 0 0; background: #F6F4F1; box-sizing: border-box; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 16px; position: relative">
    <div style="display: flex; align-items: center; gap: 16px">
      <svg width="92" height="92" viewBox="0 0 92 92" role="img" aria-label="12 minutes 40 seconds until next check-in">
        <circle cx="46" cy="46" r="40" fill="none" stroke="#E4E1EA" stroke-width="8"></circle>
        <circle cx="46" cy="46" r="40" fill="none" stroke="{{primary}}" stroke-width="8" stroke-linecap="round" stroke-dasharray="176 251" transform="rotate(-90 46 46)"></circle>
        <text x="46" y="52" text-anchor="middle" font-family="Sora, sans-serif" font-size="19" font-weight="700" fill="#171A2F">12:40</text>
      </svg>
      <div>
        <div style="font-size: 13px; font-weight: 700; color: {{primary}}; text-transform: uppercase; letter-spacing: 0.08em">Next check-in</div>
        <div style="font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.15; margin-top: 2px">Heading home</div>
        <div style="font-size: 14px; color: #5C6070; margin-top: 2px">Started 9:05 PM · every 20 min</div>
      </div>
    </div>
    <div style="padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1EA; font-size: 14px; line-height: 1.45; color: #474B5C">If you miss a check-in, <strong style="color: #171A2F">Ammu and Abbu</strong> are alerted with your last location.</div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 60px; border: none; border-radius: 18px; background: {{primary}}; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>I am safe · check in</button>
      <div style="display: flex; gap: 10px">
        <button style="flex-grow: 1; height: 52px; border: 1.5px solid #D9D5E1; border-radius: 16px; background: #FFFFFF; color: #171A2F; font-size: 15px; font-weight: 700">Extend 15 min</button>
        <button style="flex-grow: 1; height: 52px; border: 1.5px solid #D9D5E1; border-radius: 16px; background: #FFFFFF; color: #171A2F; font-size: 15px; font-weight: 700">I have arrived</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3B45B5","options":["#3B45B5","#0B6E73","#6D2E8C","#1E3A5F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#3B45B5' };
  }
}
</script>
</body>
</html>
